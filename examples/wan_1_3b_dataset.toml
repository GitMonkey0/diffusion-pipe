# 训练分辨率  
resolutions = [512]  

# 启用宽高比分桶  
enable_ar_bucket = true  
min_ar = 0.5  
max_ar = 2.0  
num_ar_buckets = 7  

# 帧数桶配置  
# [1]: 仅训练图片  
# [1, 33]: 训练图片和33帧视频  
# [1, 33, 65, 97]: 更长视频（需要更多显存）  
frame_buckets = [1, 33]  

[[directory]]  
# 修改为您的数据集路径  
# 图片/视频文件和对应的.txt标注文件应在此目录  
path = '/mnt/bn/douyin-ai4se-general-wl/lht/data/t2v/'  
num_repeats = 1  

